    function getUrlSettings() {
        const searchParams = new URLSearchParams(window.location.search);
        const langParam = searchParams.get('lang');
        const rawHash = window.location.hash.replace('#', '').toLowerCase();

        // 1. Detect language
        let lang = 'es';
        if (langParam === 'en' || langParam === 'es') {
            lang = langParam;
        } else if (rawHash.includes('lang=en') || rawHash.endsWith('-en') || rawHash.endsWith('_en')) {
            lang = 'en';
        } else if (rawHash.includes('lang=es') || rawHash.endsWith('-es') || rawHash.endsWith('_es')) {
            lang = 'es';
        } else {
            const saved = localStorage.getItem('koalita_lang');
            if (saved === 'en' || saved === 'es') {
                lang = saved;
            } else if (navigator.language && navigator.language.toLowerCase().startsWith('en')) {
                lang = 'en';
            }
        }

        // 2. Detect tab
        let cleanHash = rawHash.split('?')[0].replace(/[-_](en|es)$/, '');
        let tab = 'privacy';
        if (cleanHash === 'terms' || cleanHash === 'terminos') {
            tab = 'terms';
        } else if (cleanHash === 'deletion' || cleanHash === 'eliminacion' || cleanHash === 'delete') {
            tab = 'deletion';
        } else {
            tab = 'privacy';
        }

        return { tab, lang };
    }

    function switchTab(tabKey) {
        currentTab = tabKey;
        const url = new URL(window.location.href);
        url.hash = '#' + tabKey;
        window.history.replaceState({}, '', url.toString());
        render();
    }

    function setLang(lang) {
        currentLang = lang;
        try { localStorage.setItem('koalita_lang', lang); } catch (_) {}
        const url = new URL(window.location.href);
        url.searchParams.set('lang', lang);
        window.history.replaceState({}, '', url.toString());
        render();
    }

    function render() {
        // Actualizar estados de botones de idioma
        document.getElementById('btnEs').classList.toggle('active', currentLang === 'es');
        document.getElementById('btnEn').classList.toggle('active', currentLang === 'en');
        document.documentElement.lang = currentLang;

        // Actualizar estados de botones de pestañas
        document.getElementById('tabPrivacy').classList.toggle('active', currentTab === 'privacy');
        document.getElementById('tabTerms').classList.toggle('active', currentTab === 'terms');
        document.getElementById('tabDeletion').classList.toggle('active', currentTab === 'deletion');

        // Textos de pestañas según idioma
        document.getElementById('labelTabPrivacy').innerText = data.privacy[currentLang].tabName;
        document.getElementById('labelTabTerms').innerText = data.terms[currentLang].tabName;
        document.getElementById('labelTabDeletion').innerText = data.deletion[currentLang].tabName;

        const currentData = data[currentTab][currentLang];
        const icon = data[currentTab].icon;

        document.getElementById('headerIcon').innerText = icon;
        document.getElementById('mainTitle').innerText = currentData.title;
        document.getElementById('updatedText').innerHTML = currentData.updated;

        // Footer
        document.getElementById('footerText').innerHTML = currentLang === 'en'
            ? '&copy; 2026 Onze Solutions &bull; Koalita BabyCare. All rights reserved.'
            : '&copy; 2026 Onze Solutions &bull; Koalita BabyCare. Todos los derechos reservados.';

        // Banner
        const bannerBox = document.getElementById('bannerBox');
        bannerBox.className = currentData.bannerType === 'warning' ? 'notice-banner' : 'notice-banner info';
        document.getElementById('bannerText').innerHTML = currentData.banner;

        // Highlights Grid
        const hlBox = document.getElementById('highlightsBox');
        hlBox.innerHTML = '';
        currentData.highlights.forEach(h => {
            const card = document.createElement('div');
            card.className = 'highlight-card';
            card.innerHTML = `<h3>${h.icon} ${h.title}</h3><p>${h.desc}</p>`;
            hlBox.appendChild(card);
        });

        // Content Sections
        const container = document.getElementById('contentContainer');
        container.innerHTML = '';
        currentData.sections.forEach(s => {
            const card = document.createElement('section');
            card.className = 'section-card';
            let html = `<h2>${s.icon} ${s.title}</h2><p>${s.text}</p>`;
            if (s.list) {
                html += '<ul>';
                s.list.forEach(item => {
                    html += `<li>${item}</li>`;
                });
                html += '</ul>';
            }
            card.innerHTML = html;
            container.appendChild(card);
        });
    }

    function init() {
        const settings = getUrlSettings();
        currentTab = settings.tab;
        currentLang = settings.lang;
        render();
    }

    window.addEventListener('hashchange', () => {
        const settings = getUrlSettings();
        currentTab = settings.tab;
        currentLang = settings.lang;
        render();
    });

    init();
</script>
